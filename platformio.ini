; GPS tracker — final project (ESP32-S3 DevKitC-1, ESP-IDF via PlatformIO).
; Conventions follow the course homework repo (TECH_REQUIREMENTS.md there).

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = time, default
test_ignore = test_native

; Host-side unit tests for the pure logic (NMEA parser, filters, geodesy):
;   pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17
