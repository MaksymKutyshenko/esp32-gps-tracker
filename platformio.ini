; GPS tracker — final project (ESP32-S3, ESP-IDF via PlatformIO).
; Conventions follow the course homework repo (TECH_REQUIREMENTS.md there).
;
; Two hardware targets share one firmware; the pin map is selected by the
; BOARD_* define (see include/config.hpp and docs/HARDWARE.md):
;   pio run -e supermini   ESP32-S3 SuperMini, 4 MB flash (primary)
;   pio run -e devkitc     ESP32-S3 DevKitC-1 (fallback)
; Development happens on the DevKitC (default environment): its CP2102 UART
; console survives deep sleep and crashes. The SuperMini has no bridge, so
; its environment moves the console to the chip's USB Serial/JTAG port
; through sdkconfig.defaults.supermini.

[platformio]
default_envs = devkitc

; Shared settings for the two ESP32-S3 targets. Not in [env], so the native
; test environment below does not inherit the ESP-IDF framework.
[esp]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1
monitor_speed = 115200
monitor_filters = time, default, esp32_exception_decoder
; Show what is typed into the serial console (the board does not echo).
monitor_echo = yes
test_ignore = test_native

[env:supermini]
extends = esp
; The SuperMini carries an ESP32-S3FH4R2: 4 MB flash, no octal PSRAM.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags = -DBOARD_SUPERMINI=1
; ESP-IDF merges these in order; the second file switches the console.
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.supermini"

[env:devkitc]
extends = esp
build_flags = -DBOARD_DEVKITC=1

; Host-side unit tests for the pure logic (NMEA parser, filters, geodesy):
;   pio test -e native
[env:native]
platform = native
; test/stubs provides a stand-in esp_err.h so the Transport classes that
; return esp_err_t (TrackLogger, UplinkScheduler) are testable on the host.
build_flags = -std=gnu++17 -Itest/stubs
