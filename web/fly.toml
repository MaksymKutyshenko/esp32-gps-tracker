# Fly.io deployment: `fly launch --copy-config --no-deploy` once (pick a
# unique app name), set the secrets, then `fly deploy`. See README.md.
app = "gps-tracker-web"
primary_region = "waw"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5055"
  HOST = "0.0.0.0"
  ONLINE_TIMEOUT_S = "150"

[http_service]
  internal_port = 5055
  # The SIM800C speaks plain HTTP only: no redirect to HTTPS. The browser
  # still uses https://<app>.fly.dev, Fly terminates TLS for it.
  force_https = false
  # Keep one machine up: the device reports every few seconds and open
  # dashboards hold an SSE stream.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
