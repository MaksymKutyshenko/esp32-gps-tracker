# fly.toml app configuration file generated for gps-tracker-mk on 2026-10-11T12:08:21+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gps-tracker-mk'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  ONLINE_TIMEOUT_S = '150'
  PORT = '5055'

[http_service]
  internal_port = 5055
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
